{% extends "base.html" %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">Editar Usuario: {{ usuario.nombres_apellidos }}</h4>
                </div>
                <div class="card-body">
                    <form method="POST">
                        <div class="mb-3">
                            <label for="nombres_apellidos" class="form-label">Nombres y Apellidos</label>
                            <input type="text" class="form-control" id="nombres_apellidos" name="nombres_apellidos" value="{{ usuario.nombres_apellidos }}" required>
                        </div>

                        <div class="mb-3">
                            <label for="dni" class="form-label">DNI</label>
                            <input type="text" class="form-control" id="dni" name="dni" value="{{ usuario.dni or '' }}">
                        </div>

                        <div class="mb-3">
                            <label for="correo" class="form-label">Correo Electrónico</label>
                            <input type="email" class="form-control" id="correo" name="correo" value="{{ usuario.correo }}" required>
                        </div>

                        <div class="mb-3">
                            <label for="rol" class="form-label">Rol Asignado</label>
                            <select class="form-select" id="rol" name="rol" required>
                                {% if current_user_role == 'Superadmin' %}
                                <option value="Superadmin" {% if usuario.rol == 'Superadmin' %}selected{% endif %}>Superadmin</option>
                                <option value="Director" {% if usuario.rol == 'Director' %}selected{% endif %}>Director</option>
                                {% endif %}
                                <option value="Administrador" {% if usuario.rol == 'Administrador' %}selected{% endif %}>Administrador</option>
                                <option value="Recepcionista" {% if usuario.rol == 'Recepcionista' %}selected{% endif %}>Recepcionista</option>
                                <option value="Especialista" {% if usuario.rol == 'Especialista' %}selected{% endif %}>Especialista</option>
                                <option value="Paciente" {% if usuario.rol == 'Paciente' %}selected{% endif %}>Paciente</option>
                            </select>
                        </div>

                        {% if current_user_role == 'Superadmin' and clientes %}
                        <div class="mb-3">
                            <label for="id_cliente" class="form-label">Empresa Cliente Asignada</label>
                            <select class="form-select" id="id_cliente" name="id_cliente">
                                <option value="">-- Ninguna (Global / Superadmin) --</option>
                                {% for cli in clientes %}
                                <option value="{{ cli.id_cliente }}" {% if usuario.id_cliente == cli.id_cliente %}selected{% endif %}>{{ cli.nombre_marca }} (RUC: {{ cli.ruc }})</option>
                                {% endfor %}
                            </select>
                        </div>
                        {% endif %}

                        <div class="d-flex justify-content-between">
                            <a href="{{ url_for('usuarios') }}" class="btn btn-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-success">Guardar Cambios</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
