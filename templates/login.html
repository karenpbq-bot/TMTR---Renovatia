<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Bienestar App</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f3f4f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #1f2937;
        }
        .card-login {
            background-color: #ffffff;
            border: 1px solid rgba(168, 85, 247, 0.25); /* Matiz lila sutil en el contorno */
            border-radius: 1rem;
            box-shadow: 0 1rem 2.5rem rgba(168, 85, 247, 0.1), 0 0.5rem 1rem rgba(0, 0, 0, 0.05);
        }
        .form-control {
            background-color: #f8fafc;
            border: 1px solid #cbd5e1;
            color: #1e293b;
            padding: 0.75rem 1rem;
        }
        .form-control:focus {
            background-color: #ffffff;
            border-color: #22c55e;
            color: #1e293b;
            box-shadow: 0 0 0 0.25rem rgba(34, 197, 94, 0.15);
        }
        .form-control::placeholder {
            color: #94a3b8;
        }
        .btn-custom-primary {
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            border: none;
            color: #ffffff;
            font-weight: 600;
            padding: 0.75rem;
            transition: opacity 0.2s ease-in-out;
        }
        .btn-custom-primary:hover {
            opacity: 0.92;
            color: #ffffff;
        }
        .brand-title {
            color: #16a34a;
            letter-spacing: -0.025em;
        }
        .brand-subtitle {
            color: #7c3aed !important; /* Tono lila institucional para Bienestar App */
            letter-spacing: 0.05em;
            font-size: 0.85rem;
        }
        .alert-custom {
            background-color: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #dc2626;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card card-login p-4 p-md-5">
                    
                    <!-- Encabezado con el Logo de Tamtara y Bienestar App -->
                    <div class="text-center mb-4">
                        <div class="mb-3">
                            <img src="{{ url_for('static', filename='Logo_Tamtara.png') }}" alt="Logo Tamtara" style="max-height: 65px; width: auto;" onerror="this.style.display='none'">
                        </div>
                        <h6 class="fw-bold text-uppercase brand-subtitle mb-1">Bienestar App</h6>
                        <p class="text-muted small m-0">Ingrese sus credenciales para acceder</p>
                    </div>

                    <!-- Mensajes Flash de Alerta -->
                    {% with messages = get_flashed_messages(with_categories=true) %}
                        {% if messages %}
                            {% for category, message in messages %}
                                {% if "cerrado sesión" not in message.lower() %}
                                    <div class="alert alert-custom rounded-3 mb-4 small p-3 d-flex align-items-center justify-content-between" role="alert">
                                        <div>{{ message }}</div>
                                        <button type="button" class="btn-close ms-2" data-bs-dismiss="alert" aria-label="Close" style="font-size: 0.7rem;"></button>
                                    </div>
                                {% endif %}
                            {% endfor %}
                        {% endif %}
                    {% endwith %}

                    <!-- Formulario de Inicio de Sesión -->
                    <form method="POST" action="{{ url_for('auth.login') }}">
                        <div class="mb-3">
                            <label for="correo" class="form-label fw-semibold small text-secondary">Correo Electrónico</label>
                            <input type="email" class="form-control rounded-pill" id="correo" name="correo" placeholder="nombre@ejemplo.com" required autofocus>
                        </div>
                        
                        <div class="mb-3">
                            <label for="password" class="form-label fw-semibold small text-secondary">Contraseña</label>
                            <input type="password" class="form-control rounded-pill" id="password" name="password" placeholder="••••••••" required>
                        </div>

                        <div class="mb-4 form-check">
                            <input type="checkbox" class="form-check-input" id="remember">
                            <label class="form-check-label small text-muted" for="remember">Mantener sesión abierta</label>
                        </div>

                        <div class="d-grid mb-3">
                            <button type="submit" class="btn btn-custom-primary rounded-pill shadow-sm">Ingresar</button>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
